# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - 'main'
    paths:
      - 'src/**'
      - 'build/**'
      - 'public/**'
      - 'package.json'
      - '.github/workflows/static.yml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      # Fail fast with a readable message instead of the opaque
      # "No artifacts named github-pages were found" from deploy-pages.
      - name: Verify build output
        run: |
          if [ ! -d "dist/WEBSITE" ]; then
            echo "::error::dist/WEBSITE was not generated by 'npm run build'."
            exit 1
          fi
          if [ -z "$(ls -A dist/WEBSITE)" ]; then
            echo "::error::dist/WEBSITE is empty."
            exit 1
          fi
          echo "Build output: $(find dist/WEBSITE -type f | wc -l) files, $(du -sh dist/WEBSITE | cut -f1)"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist/WEBSITE'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
